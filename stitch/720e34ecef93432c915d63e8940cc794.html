<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sayı Limit Uyarısı</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#ffb783",
                        "on-error": "#690005",
                        "on-surface": "#dae2fd",
                        "surface-variant": "#2d3449",
                        "inverse-on-surface": "#283044",
                        "surface-container-high": "#222a3d",
                        "surface-container-low": "#131b2e",
                        "on-primary-fixed": "#07006c",
                        "on-secondary": "#3c0091",
                        "on-primary-container": "#0d0096",
                        "surface-container": "#171f33",
                        "on-background": "#dae2fd",
                        "error-container": "#93000a",
                        "tertiary-container": "#d97721",
                        "primary-container": "#8083ff",
                        "surface-bright": "#31394d",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "primary-fixed-dim": "#c0c1ff",
                        "secondary": "#d0bcff",
                        "on-tertiary-fixed-variant": "#703700",
                        "outline-variant": "#464554",
                        "on-secondary-fixed-variant": "#5516be",
                        "surface-dim": "#0b1326",
                        "on-secondary-fixed": "#23005c",
                        "secondary-fixed-dim": "#d0bcff",
                        "primary-fixed": "#e1e0ff",
                        "surface": "#0b1326",
                        "background": "#0b1326",
                        "tertiary-fixed-dim": "#ffb783",
                        "on-surface-variant": "#c7c4d7",
                        "on-error-container": "#ffdad6",
                        "surface-container-lowest": "#060e20",
                        "primary": "#c0c1ff",
                        "error": "#ffb4ab",
                        "surface-container-highest": "#2d3449",
                        "on-secondary-container": "#c4abff",
                        "tertiary-fixed": "#ffdcc5",
                        "on-tertiary-fixed": "#301400",
                        "outline": "#908fa0",
                        "secondary-container": "#571bc1",
                        "inverse-surface": "#dae2fd",
                        "on-tertiary-container": "#452000",
                        "on-primary": "#1000a9",
                        "surface-tint": "#c0c1ff",
                        "secondary-fixed": "#e9ddff",
                        "inverse-primary": "#494bd6",
                        "on-tertiary": "#4f2500"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {},
                    "fontFamily": {
                        "headline": ["Space Grotesk", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-surface text-on-surface font-body h-screen flex flex-col md:flex-row overflow-hidden">
<!-- SideNavBar (Web) -->
<nav class="hidden md:flex bg-[#131b2e] dark:bg-[#131b2e] h-screen w-72 fixed left-0 top-0 z-40 flex-col gap-4 py-8 shadow-[20px_0px_40px_rgba(0,0,0,0.4)]">
<div class="px-6 mb-8">
<span class="text-2xl font-black text-indigo-400 font-headline tracking-tighter">Neonist</span>
</div>
<div class="flex flex-col gap-2 w-full">
<a class="bg-gradient-to-r from-indigo-500 to-violet-600 text-white rounded-r-full py-3 px-6 shadow-lg shadow-indigo-500/20 font-headline uppercase tracking-widest text-xs font-bold flex items-center gap-3 w-[90%] scale-105 transition-transform" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">speed</span>
                Dashboard
            </a>
<a class="text-slate-400 py-3 px-6 hover:text-indigo-300 font-headline uppercase tracking-widest text-xs font-bold flex items-center gap-3 hover:bg-[#2d3449] transition-all duration-200 rounded-r-full w-[90%]" href="#">
<span class="material-symbols-outlined">analytics</span>
                Statistics
            </a>
<a class="text-slate-400 py-3 px-6 hover:text-indigo-300 font-headline uppercase tracking-widest text-xs font-bold flex items-center gap-3 hover:bg-[#2d3449] transition-all duration-200 rounded-r-full w-[90%]" href="#">
<span class="material-symbols-outlined">settings</span>
                Settings
            </a>
</div>
<div class="mt-auto px-6">
<div class="flex items-center gap-3 p-4 bg-surface-container-highest rounded-lg shadow-lg">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-on-primary-container">person</span>
</div>
<div>
<p class="font-headline text-sm font-bold text-on-surface">History</p>
<p class="text-xs text-on-surface-variant">Recent Activity</p>
</div>
</div>
</div>
</nav>
<!-- TopAppBar (Mobile) -->
<header class="md:hidden bg-[#0b1326] dark:bg-[#0b1326] flex justify-between items-center w-full px-6 py-4 max-w-full docked full-width top-0 sticky z-50">
<span class="text-2xl font-black text-indigo-400 font-headline tracking-tighter">Neonist</span>
<button class="text-slate-400 hover:text-indigo-200 hover:bg-indigo-500/10 transition-colors duration-300 p-2 rounded-full">
<span class="material-symbols-outlined">dark_mode</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 md:ml-72 flex flex-col items-center justify-center relative p-6 bg-surface overflow-y-auto">
<!-- Toast Notification -->
<div class="absolute top-6 left-1/2 -translate-x-1/2 z-50 w-full max-w-md px-4">
<div class="bg-error-container/20 backdrop-blur-[20px] rounded-lg p-4 flex items-center gap-3 shadow-[0px_20px_40px_rgba(0,0,0,0.4)] ring-1 ring-error/30">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">warning</span>
<p class="text-error font-body font-medium text-sm">Maksimum sayı limitine ulaşıldı! (999,999)</p>
</div>
</div>
<!-- Hero Counter Section -->
<section class="flex flex-col items-center justify-center w-full max-w-4xl relative z-10">
<div class="relative w-full aspect-square max-w-[400px] flex items-center justify-center mb-12">
<!-- Glowing Background -->
<div class="absolute inset-0 bg-secondary-container rounded-full opacity-40 blur-3xl scale-125"></div>
<!-- Counter Display -->
<div class="relative z-10 bg-surface-container-low/60 backdrop-blur-md rounded-full w-full h-full flex flex-col items-center justify-center shadow-[0px_20px_40px_rgba(0,0,0,0.4)]">
<p class="font-headline text-on-surface-variant text-lg tracking-widest uppercase mb-2">Total Count</p>
<h1 class="font-mono text-7xl md:text-8xl font-bold text-error tracking-tighter">999,999</h1>
</div>
</div>
<!-- Controls -->
<div class="flex flex-col sm:flex-row gap-6 items-center">
<!-- Disabled Increment Button -->
<button class="h-16 px-12 rounded-full bg-surface-variant text-on-surface-variant font-headline font-bold text-lg flex items-center gap-2 opacity-50 cursor-not-allowed border border-outline-variant/15 shadow-none" disabled="">
<span class="material-symbols-outlined">add</span>
                    Artır
                </button>
<!-- Reset Button -->
<button class="h-16 px-8 rounded-full bg-surface-container-highest text-on-surface font-headline font-bold flex items-center gap-2 shadow-[0px_10px_20px_rgba(0,0,0,0.2)] hover:bg-surface-bright transition-colors">
<span class="material-symbols-outlined">refresh</span>
                    Sıfırla
                </button>
</div>
</section>
</main>
<!-- Bottom Navigation (Mobile) - Simple representation as requested to hide if not top level, but dashboard implies top level -->
<nav class="md:hidden fixed bottom-0 left-0 w-full bg-surface-container-low shadow-[0px_-10px_30px_rgba(0,0,0,0.5)] z-40 pb-safe">
<div class="flex justify-around items-center py-3">
<a class="flex flex-col items-center gap-1 text-primary-fixed-dim font-bold" href="#">
<div class="bg-primary-container/20 px-4 py-1 rounded-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">speed</span>
</div>
<span class="text-[10px] font-headline uppercase tracking-wider">Dash</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary-fixed-dim transition-colors" href="#">
<span class="material-symbols-outlined px-4 py-1">analytics</span>
<span class="text-[10px] font-headline uppercase tracking-wider">Stats</span>
</a>
<a class="flex flex-col items-center gap-1 text-slate-400 hover:text-primary-fixed-dim transition-colors" href="#">
<span class="material-symbols-outlined px-4 py-1">settings</span>
<span class="text-[10px] font-headline uppercase tracking-wider">Settings</span>
</a>
</div>
</nav>
</body></html>
