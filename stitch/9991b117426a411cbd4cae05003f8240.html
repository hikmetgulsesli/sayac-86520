<!DOCTYPE html>

<html class="dark" lang="tr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Neonist - Henüz İşlem Yapılmadı</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;700;800&amp;family=Space+Grotesk:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#ffb783",
                        "on-error": "#690005",
                        "on-surface": "#dae2fd",
                        "surface-variant": "#2d3449",
                        "inverse-on-surface": "#283044",
                        "surface-container-high": "#222a3d",
                        "surface-container-low": "#131b2e",
                        "on-primary-fixed": "#07006c",
                        "on-secondary": "#3c0091",
                        "on-primary-container": "#0d0096",
                        "surface-container": "#171f33",
                        "on-background": "#dae2fd",
                        "error-container": "#93000a",
                        "tertiary-container": "#d97721",
                        "primary-container": "#8083ff",
                        "surface-bright": "#31394d",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "primary-fixed-dim": "#c0c1ff",
                        "secondary": "#d0bcff",
                        "on-tertiary-fixed-variant": "#703700",
                        "outline-variant": "#464554",
                        "on-secondary-fixed-variant": "#5516be",
                        "surface-dim": "#0b1326",
                        "on-secondary-fixed": "#23005c",
                        "secondary-fixed-dim": "#d0bcff",
                        "primary-fixed": "#e1e0ff",
                        "surface": "#0b1326",
                        "background": "#0b1326",
                        "tertiary-fixed-dim": "#ffb783",
                        "on-surface-variant": "#c7c4d7",
                        "on-error-container": "#ffdad6",
                        "surface-container-lowest": "#060e20",
                        "primary": "#c0c1ff",
                        "error": "#ffb4ab",
                        "surface-container-highest": "#2d3449",
                        "on-secondary-container": "#c4abff",
                        "tertiary-fixed": "#ffdcc5",
                        "on-tertiary-fixed": "#301400",
                        "outline": "#908fa0",
                        "secondary-container": "#571bc1",
                        "inverse-surface": "#dae2fd",
                        "on-tertiary-container": "#452000",
                        "on-primary": "#1000a9",
                        "surface-tint": "#c0c1ff",
                        "secondary-fixed": "#e9ddff",
                        "inverse-primary": "#494bd6",
                        "on-tertiary": "#4f2500"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {},
                    "fontFamily": {
                        "headline": ["Space Grotesk", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-headline { font-family: 'Space Grotesk', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col md:flex-row overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Mobile TopAppBar -->
<header class="md:hidden docked full-width top-0 sticky z-50 bg-[#0b1326] dark:bg-[#0b1326]">
<div class="flex justify-between items-center w-full px-6 py-4 max-w-full">
<div class="text-2xl font-black text-indigo-400 font-['Space_Grotesk'] tracking-tighter">
                Neonist
            </div>
<div class="flex items-center gap-4">
<button class="text-slate-400 hover:text-indigo-200 hover:bg-indigo-500/10 transition-colors duration-300 p-2 rounded-full active:scale-95 duration-150">
<span class="material-symbols-outlined">dark_mode</span>
</button>
</div>
</div>
</header>
<!-- Web SideNavBar -->
<nav class="hidden md:flex flex-col gap-4 py-8 h-full bg-[#131b2e] dark:bg-[#131b2e] shadow-[20px_0px_40px_rgba(0,0,0,0.4)] h-screen w-72 fixed left-0 top-0 z-40">
<div class="px-6 mb-8">
<h1 class="text-3xl font-black text-indigo-400 font-['Space_Grotesk'] tracking-tighter">Neonist</h1>
</div>
<div class="flex-1 flex flex-col gap-2 w-full">
<a class="bg-gradient-to-r from-indigo-500 to-violet-600 text-white rounded-r-full py-3 px-6 shadow-lg shadow-indigo-500/20 font-['Space_Grotesk'] uppercase tracking-widest text-xs font-bold scale-105 transition-transform flex items-center gap-4" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">speed</span>
                Dashboard
            </a>
<a class="text-slate-400 py-3 px-6 hover:text-indigo-300 hover:bg-[#2d3449] transition-all duration-200 font-['Space_Grotesk'] uppercase tracking-widest text-xs font-bold flex items-center gap-4 mr-4 rounded-r-full" href="#">
<span class="material-symbols-outlined">analytics</span>
                Statistics
            </a>
<a class="text-slate-400 py-3 px-6 hover:text-indigo-300 hover:bg-[#2d3449] transition-all duration-200 font-['Space_Grotesk'] uppercase tracking-widest text-xs font-bold flex items-center gap-4 mr-4 rounded-r-full" href="#">
<span class="material-symbols-outlined">settings</span>
                Settings
            </a>
</div>
<div class="mt-auto px-6 pt-6 border-t border-surface/50">
<div class="flex items-center gap-4 bg-surface-container-low p-4 rounded-xl">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary font-bold">
<span class="material-symbols-outlined">person</span>
</div>
<div>
<div class="font-headline font-bold text-sm text-on-surface">User Profile</div>
<div class="text-xs text-on-surface-variant">Active</div>
</div>
</div>
</div>
</nav>
<!-- Main Content Area -->
<main class="flex-1 md:ml-72 flex flex-col lg:flex-row relative z-0 min-h-[calc(100vh-72px)] md:min-h-screen">
<!-- Left: The Counter (Hero Component) -->
<section class="flex-1 flex flex-col items-center justify-center p-8 relative overflow-hidden">
<!-- Asymmetrical Background Glow -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-secondary-container rounded-full blur-[100px] opacity-40 pointer-events-none"></div>
<div class="z-10 flex flex-col items-center gap-12">
<h2 class="font-headline text-3xl md:text-5xl font-bold tracking-tight text-on-surface text-center">
                    Güncel Sayım
                </h2>
<div class="font-mono text-8xl md:text-[12rem] font-extrabold text-on-surface leading-none tracking-tighter drop-shadow-[0_20px_40px_rgba(0,0,0,0.4)]">
                    0
                </div>
<div class="flex gap-6 mt-8">
<button class="w-20 h-20 md:w-24 md:h-24 rounded-full bg-surface-container-highest border border-outline-variant/15 flex items-center justify-center text-on-surface-variant hover:bg-surface-bright transition-colors">
<span class="material-symbols-outlined text-4xl">remove</span>
</button>
<button class="h-20 md:h-24 px-12 md:px-16 rounded-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold text-2xl md:text-3xl shadow-[0_20px_40px_rgba(0,0,0,0.4)] hover:scale-105 transition-transform flex items-center gap-4">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">add</span>
                        Artır
                    </button>
<button class="w-20 h-20 md:w-24 md:h-24 rounded-full bg-surface-container-highest border border-outline-variant/15 flex items-center justify-center text-error hover:bg-error-container hover:text-on-error-container transition-colors">
<span class="material-symbols-outlined text-3xl">restart_alt</span>
</button>
</div>
</div>
</section>
<!-- Right: Empty History State -->
<section class="w-full lg:w-96 bg-surface-container-low flex flex-col items-center justify-center p-8 lg:border-l-0 lg:shadow-[-20px_0_40px_rgba(0,0,0,0.2)] z-10 min-h-[400px]">
<div class="w-full max-w-sm text-center flex flex-col items-center justify-center gap-6">
<div class="w-32 h-32 rounded-full bg-surface-container-high flex items-center justify-center shadow-[inset_0_2px_10px_rgba(0,0,0,0.5)] mb-4">
<span class="material-symbols-outlined text-6xl text-outline opacity-50" style="font-variation-settings: 'FILL' 0;">
                        history_toggle_off
                    </span>
</div>
<h3 class="font-headline text-2xl font-bold text-on-surface">History</h3>
<p class="font-body text-on-surface-variant text-lg">
                    Henüz işlem yapılmadı
                </p>
<div class="mt-8 px-6 py-4 bg-surface-container rounded-xl w-full border border-outline-variant/15 text-sm text-on-surface-variant text-center">
                    İlk işleminizi yaptığınızda geçmiş burada görünecektir.
                </div>
</div>
</section>
</main>
</body></html>
